<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lipika Free</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a0a">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:white;font-family:system-ui;height:100vh;display:flex;flex-direction:column}
#splash{position:fixed;inset:0;background:#0a0a0a;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:hideSplash 0.5s forwards;animation-delay:2s}
@keyframes hideSplash{to{opacity:0;visibility:hidden}}
#header{padding:16px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px;padding-bottom:90px}
.card{background:#1a1a1a;border:1px solid #252525;border-radius:20px;padding:20px;text-decoration:none;color:white;display:block}
.card b{display:block;margin-top:8px}
.card small{color:#777}
#bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #222;display:flex;justify-content:space-around;padding:12px 0 22px 0}
.nav-item{text-align:center;color:#888;font-size:11px;text-decoration:none}
.nav-item.active{color:#a78bfa}
.search-box{display:flex;gap:10px;padding:16px}
.search-box input{flex:1;padding:14px;border-radius:14px;border:1px solid #333;background:#1a1a1a;color:white;outline:none}
.search-box button{padding:14px 18px;border-radius:14px;border:none;background:#a78bfa;font-weight:bold}
</style>
</head>
<body>

<div id="splash">
  <img src="https://cdn-icons-png.flaticon.com/512/4712/4712109.png" width="80" style="border-radius:20px;margin-bottom:15px">
  <h1 style="font-size:32px;color:#a78bfa">Lipika Free</h1>
  <p style="color:#555;margin-top:8px;font-size:13px">jubayed062 • All in One AI</p>
</div>

<div id="header">
  <b>Lipika ✨</b>
  <div style="background:#1f1f1f;padding:6px 12px;border-radius:20px;font-size:12px" id="user">Free User</div>
</div>

<div class="search-box">
  <input id="q" placeholder="যা জানতে চাও লিখো...">
  <button onclick="ask()">Ask</button>
</div>

<div class="grid">
  <a class="card" href="https://chat.openai.com" target="_blank">🤖<b>ChatGPT</b><small>Code & Writing</small></a>
  <a class="card" href="https://gemini.google.com" target="_blank">✨<b>Gemini</b><small>Fast & Free</small></a>
  <a class="card" href="https://claude.ai" target="_blank">🧠<b>Claude</b><small>Long Text</small></a>
  <a class="card" href="https://www.perplexity.ai" target="_blank">🔍<b>Perplexity</b><small>Search AI</small></a>
  <a class="card" href="https://poe.com" target="_blank">🚀<b>Poe All</b><small>সব AI একসাথে</small></a>
  <a class="card" href="https://leonardo.ai" target="_blank">🎨<b>Image AI</b><small>ছবি বানাও</small></a>
</div>

<div id="bottom-nav">
  <a class="nav-item active" href="#">🏠<br>Home</a>
  <a class="nav-item" href="https://poe.com" target="_blank">💬<br>Chat</a>
  <a class="nav-item" href="https://leonardo.ai" target="_blank">🎨<br>Create</a>
  <a class="nav-item" href="#" onclick="setUser()">👤<br>You</a>
</div>

<script>
function ask(){
  let q=document.getElementById('q').value;
  if(!q) return alert('কিছু লিখো!');
  window.open('https://www.perplexity.ai/search?q='+encodeURIComponent(q),'_blank');
}
function setUser(){
  let e=localStorage.getItem('lipika_user')||prompt("Gmail দাও:");
  if(e){localStorage.setItem('lipika_user',e);document.getElementById('user').innerText=e.split('@')[0];}
}
let s=localStorage.getItem('lipika_user');
if(s) document.getElementById('user').innerText=s.split('@')[0];
// Force hide splash after 2.5s even if animation fails
setTimeout(()=>{let sp=document.getElementById('splash'); if(sp) sp.style.display='none'},2500);
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(r=>{r.forEach(x=>x.unregister())})}
</script>
</body>
</html>
