*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:white;font-family:system-ui;overflow:hidden;height:100vh;display:flex;flex-direction:column}
#splash{position:fixed;inset:0;background:var(--bg);z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:0.5s}
#splash h1{font-size:36px;background:linear-gradient(90deg,#a78bfa,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#header{padding:16px 20px;display:flex;justify-content:space-between;align-items:center;background:var(--bg);border-bottom:1px solid #222}
#header b{font-size:20px}
.user-pill{background:#1f1f1f;padding:6px 12px;border-radius:20px;font-size:12px;color:#aaa}
#content{flex:1;overflow-y:auto;padding:16px;padding-bottom:90px}
.search-box{display:flex;gap:10px;margin-bottom:20px}
.search-box input{flex:1;padding:14px 16px;border-radius:14px;border:1px solid #2a2a2a;background:var(--card);color:white;font-size:15px;outline:none}
.search-box input:focus{border-color:var(--accent)}
.search-box button{padding:14px 18px;border-radius:14px;border:none;background:var(--accent);font-weight:bold}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border:1px solid #252525;border-radius:20px;padding:20px;text-align:left;text-decoration:none;color:white}
.card:active{transform:scale(0.96)}
.card .icon{font-size:28px;margin-bottom:10px;display:block}
.card b{display:block;font-size:15px}
.card small{color:#777;font-size:12px}
#bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #222;display:flex;justify-content:space-around;padding:10px 0 20px 0}
.nav-item{text-align:center;color:#666;font-size:10px;text-decoration:none;flex:1}
.nav-item.active{color:var(--accent)}
.nav-item span{font-size:22px;display:block;margin-bottom:3px}
</style>
</head>

function ask(){
  let q=document.getElementById('q').value;
  if(!q) return;
  window.open('https://www.perplexity.ai/search?q='+encodeURIComponent(q),'_blank');
}
